[tool.poetry]
name = "fitmind-coach"
version = "0.1.0"
description = "Приложение для фитнес-коучинга и планирования тренировок"
authors = ["Alexander Batogov <predatorevil666@mail.ru>"]
readme = "README.md"
packages = [{include = "fitmind_coach"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
aiogram = "^3.20.0"
python-dotenv = "^1.1.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.9.0"
pre-commit = "^4.2.0"
ruff = "^0.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79

# Все настройки линтинга переносим в подсекцию `lint`
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = []

# Настройки сортировки импортов (isort)
[tool.ruff.lint.isort]
known-first-party = ["utils"]
lines-between-types = 1
combine-as-imports = true
split-on-trailing-comma = true
order-by-type = true
