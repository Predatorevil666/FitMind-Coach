stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  CI_REGISTRY: fitmindlab.hopto.org:5050
  CI_REGISTRY_IMAGE: $CI_REGISTRY/root/fitmind-coach

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "🔨 Building API image..."
    - docker build -t $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA -f Dockerfile.api .
    - docker build -t $CI_REGISTRY_IMAGE/api:latest -f Dockerfile.api .
    - echo "🔨 Building Bot image..."
    - docker build -t $CI_REGISTRY_IMAGE/bot:$CI_COMMIT_SHA -f Dockerfile.bot .
    - docker build -t $CI_REGISTRY_IMAGE/bot:latest -f Dockerfile.bot .
    - echo "🔨 Building Migrate image..."
    - docker build -t $CI_REGISTRY_IMAGE/migrate:$CI_COMMIT_SHA -f Dockerfile.api .
    - docker build -t $CI_REGISTRY_IMAGE/migrate:latest -f Dockerfile.api .
    - echo "📤 Pushing images to registry..."
    - docker push $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/api:latest
    - docker push $CI_REGISTRY_IMAGE/bot:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/bot:latest
    - docker push $CI_REGISTRY_IMAGE/migrate:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/migrate:latest
    - echo "✅ All images built and pushed successfully!"
  only:
    - main

deploy:
  stage: deploy
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "🚀 Deploying to VPS..."
    - echo "🔑 Logging into GitLab Container Registry on VPS..."
    - ssh -o StrictHostKeyChecking=no -p $VPS_PORT $VPS_USER@$VPS_HOST "cd $VPS_PATH && echo '$CI_REGISTRY_PASSWORD' | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - echo "📥 Pulling new images..."
    - ssh -o StrictHostKeyChecking=no -p $VPS_PORT $VPS_USER@$VPS_HOST "cd $VPS_PATH && docker-compose -f docker-compose.prod.yml pull"
    - echo "🔄 Restarting services..."
    - ssh -o StrictHostKeyChecking=no -p $VPS_PORT $VPS_USER@$VPS_HOST "cd $VPS_PATH && docker-compose -f docker-compose.prod.yml up -d"
    - echo "⏳ Waiting for services to start..."
    - sleep 30
    - echo "📊 Checking service status..."
    - ssh -o StrictHostKeyChecking=no -p $VPS_PORT $VPS_USER@$VPS_HOST "cd $VPS_PATH && docker-compose -f docker-compose.prod.yml ps"
    - echo "🔍 Checking API health..."
    - ssh -o StrictHostKeyChecking=no -p $VPS_PORT $VPS_USER@$VPS_HOST "cd $VPS_PATH && curl -f http://localhost:8003/healthz || echo 'API health check failed'"
    - echo "✅ Deployment completed successfully!"
  only:
    - main
