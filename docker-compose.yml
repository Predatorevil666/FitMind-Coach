version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitmind-coach-bot
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    networks:
      - bot-network
    environment:
      - TZ=Europe/Moscow
    # Проверка работоспособности контейнера
    # Healthcheck позволяет Docker автоматически определять, работает ли сервис корректно
    healthcheck:
      # Команда проверки: возвращает успех (0), если файл логов существует и не пустой
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/app/logs/bot.log') and os.path.getsize('/app/logs/bot.log') > 0 else 1)"]
      # Интервал между проверками
      interval: 30s
      # Таймаут ожидания ответа от проверки
      timeout: 10s
      # Количество повторных попыток перед признанием контейнера нездоровым
      retries: 3
      # Время ожидания перед началом проверок (для инициализации)
      start_period: 10s

networks:
  bot-network:
    driver: bridge
