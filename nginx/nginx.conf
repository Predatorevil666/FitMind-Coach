events {
    worker_connections 1024;
}

http {
    # Простой upstream для API
    upstream api_backend {
        server 172.17.0.1:8003;
    }

    # Единственный HTTP сервер
    server {
        listen 80;
        server_name localhost;

        # API эндпоинты
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /healthz {
            proxy_pass http://api_backend/healthz;
            proxy_set_header Host $host;
        }

        # Docs
        location /docs {
            proxy_pass http://api_backend/docs;
            proxy_set_header Host $host;
        }

        # Главная страница
        location / {
            return 200 'FitMind Coach API\n/api/v1/ - API\n/healthz - Health\n/docs - Documentation\n';
            add_header Content-Type text/plain;
        }
    }
}
